<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BugPin</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #666666;
    --border: #d8d8d8;
    --accent: #ef4444;
    --accent-fg: #ffffff;
    --danger: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0f0f0;
      --bg: #1e1e1e;
      --muted: #a0a0a0;
      --border: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg);
  }
  h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  #status {
    margin: 0 0 20px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--fg);
    min-height: 1.25em;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .row:last-of-type { margin-bottom: 0; }
  .row + .row.section { margin-top: 20px; }
  button {
    flex: 1;
    font: inherit;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(128, 128, 128, 0.12); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  #exportInfo {
    margin: 20px 0 0;
    padding: 8px;
    border-radius: 6px;
    background: rgba(34, 139, 34, 0.12);
    font-size: 11px;
    line-height: 1.45;
    word-break: break-all;
  }
  #error {
    margin: 20px 0 0;
    color: var(--danger);
    font-size: 11px;
    line-height: 1.45;
  }
  #error:empty { display: none; }
  footer {
    margin-top: 20px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    text-align: right;
  }
  .link-button {
    flex: none;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 11px;
    text-decoration: underline;
    padding: 4px;
  }
</style>
</head>
<body>
  <h1>BugPin</h1>
  <p id="status">Idle</p>

  <div class="row">
    <button id="primaryBtn" class="primary" type="button">Start session</button>
  </div>
  <div class="row">
    <button id="annotateBtn" type="button" aria-pressed="false">Annotate (⌘⇧E)</button>
  </div>
  <div class="row section">
    <button id="exportBtn" type="button" disabled>Export session</button>
    <button id="discardBtn" type="button" disabled>Discard</button>
  </div>

  <p id="exportInfo" hidden></p>
  <p id="error" role="alert"></p>

  <footer>
    <button id="optionsBtn" class="link-button" type="button">Options</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
